[project]
name = "criteo-uplift"
version = "0.1.0"
description = "Criteo uplift modeling and deck project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.0,<3",
    "scikit-learn>=1.5,<2",
    "matplotlib>=3.8,<4",
    "statsmodels>=0.14,<1",
    "scikit-uplift>=0.5.1,<1",
    "joblib>=1.4,<2",
    "pyarrow>=15,<20",
    "altair>=5.3,<6",
    "vl-convert-python>=1.0,<2",
    "seaborn>=0.13,<1",
    "jupyter>=1.0,<2",
    "ipykernel>=6.29,<7",
    "nbformat>=5.9,<8",
]

[tool.uv]
package = false
